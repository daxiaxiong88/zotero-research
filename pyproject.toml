[project]
name = "zotero-research-mcp"
version = "0.4.1"
description = "A Zotero 10 reading sidebar with browser-AI relay and page-linked evidence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1.13,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pymupdf>=1.26,<2",
]

[project.scripts]
zotero-research-mcp = "zotero_research_mcp.server:main"
zotero-research-doctor = "zotero_research_mcp.doctor:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_research_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["，", "：", "（", "）", "；", "！", "？"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
